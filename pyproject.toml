[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sashimi-si"
version = "0.2.0rc1"
description = "Semi-Analytical SubHalo Inference ModelIng for Self-Interacting Dark Matter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Shin'ichiro Ando"},
  {name = "Shunichi Horigome"},
  {name = "Ethan Nadler"},
  {name = "Daneng Yang"},
  {name = "Hai-Bo Yu"},
]
dependencies = [
  "sashimi-itamae>=0.2.0rc1,<0.3",
  "numexpr>=2.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/gomeshun/sashimi-si"
Issues = "https://github.com/gomeshun/sashimi-si/issues"

[project.optional-dependencies]
demo = [
  "ipykernel>=6",
  "matplotlib>=3.8",
  "nbconvert>=7",
]
test = ["pytest>=8", "setuptools>=77"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "sashimi_si_itamae",
  "sashimi_si_itamae_components",
  "sashimi_si_itamae_migration",
  "sashimi_si_itamae_variance",
  "sashimi_si_physics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.uv.sources]
sashimi-itamae = {git = "https://github.com/gomeshun/itamae.git", rev = "23d01e8758a88b061b87de9e488c38ec89fd8e4f"}
