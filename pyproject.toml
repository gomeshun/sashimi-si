[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sashimi-si"
version = "0.1.0a1"
description = "Semi-Analytical SubHalo Inference ModelIng for Self-Interacting Dark Matter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Shin'ichiro Ando"},
  {name = "Shunichi Horigome"},
  {name = "Ethan Nadler"},
  {name = "Daneng Yang"},
  {name = "Hai-Bo Yu"},
]
dependencies = [
  "itamae>=0.1.0a4",
  "numexpr>=2.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/gomeshun/sashimi-si"
Issues = "https://github.com/gomeshun/sashimi-si/issues"

[project.optional-dependencies]
demo = [
  "ipykernel>=6",
  "matplotlib>=3.8",
  "nbconvert>=7",
]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = [
  "sashimi_si",
  "sashimi_si_itamae",
  "sashimi_si_itamae_migration",
  "sashimi_si_itamae_variance",
]

[tool.setuptools.data-files]
"share/sashimi-si" = ["itamae_migration_demo.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.uv.sources]
itamae = {git = "https://github.com/gomeshun/itamae.git", rev = "e8922c144fd94680f0481c3534a4f241e9e3b481"}
